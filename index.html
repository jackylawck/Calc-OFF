<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Offline - 離線守密</title>
    <meta name="description" content="純本地加密的離線密碼保險箱。數據零上雲，只存在你瀏覽器的 localStorage。">
    
    <!-- 企業級嚴格 CSP：無 unsafe-inline、網絡隔離、防 Clickjacking -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; frame-ancestors 'none';">
    
    <!-- PWA 標籤與圖示設定 (指向新圖示檔名) -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="./CalcOFFicon-192.png">
    <link rel="apple-touch-icon" href="./CalcOFFicon-512.png">
    
    <meta name="theme-color" content="#0b0f19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Safe Offline">
    
    <!-- 引入外部 CSS 與 JS -->
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="lang-switch">
            <button class="lang-btn" id="btn-zh">繁體中文</button>
            <button class="lang-btn" id="btn-en">English</button>
        </div>

        <header>
            <h1>🔒 Safe Offline</h1>
            <p class="slogan" data-i18n="slogan"></p>
        </header>

        <div class="card notice-card" id="notice-section">
            <h4 style="margin:0;" data-i18n="noticeTitle"></h4>
            <ul class="notice-list">
                <li data-i18n="noticePoint1"></li>
                <li data-i18n="noticePoint2"></li>
                <li data-i18n="noticePoint3"></li>
            </ul>
        </div>
        
        <div class="card" id="auth-card">
            <h3 data-i18n="unlockTitle"></h3>
            <div style="position:relative;">
                <input type="password" id="master-key" data-i18n-placeholder="masterKeyPlaceholder">
            </div>
            <button class="primary-btn" id="unlock-btn" data-i18n="unlockBtn"></button>
            
            <details class="reset-details">
                <summary data-i18n="resetToggleText"></summary>
                <div class="reset-box">
                    <p class="reset-notice" data-i18n="resetWarningText"></p>
                    <button class="danger-btn" id="btn-reset" data-i18n="resetBtnText"></button>
                </div>
            </details>
        </div>

        <div id="vault-content" style="display: none;">
            <div class="status-bar">
                <span class="status-text" data-i18n="statusUnlocked"></span>
                <button class="lock-btn" id="btn-lock" data-i18n="lockBtn"></button>
            </div>

            <div class="card">
                <h3 data-i18n="addTitle"></h3>
                <input type="text" id="site-name" data-i18n-placeholder="siteNamePlaceholder">
                <input type="text" id="site-user" data-i18n-placeholder="siteUserPlaceholder">
                <div class="flex-row">
                    <input type="password" id="site-pass" data-i18n-placeholder="sitePassPlaceholder">
                    <button class="secondary-btn" style="width:120px;" id="btn-gen-pass" data-i18n="generateBtn"></button>
                </div>
                <input type="url" id="site-url" data-i18n-placeholder="siteUrlPlaceholder">
                <button class="primary-btn" id="btn-add-entry" data-i18n="addBtn"></button>
            </div>

            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 data-i18n="listTitle" style="margin:0;"></h3>
                    <input type="text" id="search-input" data-i18n-placeholder="searchPlaceholder" style="width: 200px; padding: 6px 12px; margin:0;">
                </div>
                <div id="pass-list" style="margin-top: 15px;"></div>
            </div>

            <div class="card">
                <h3 data-i18n="backupTitle"></h3>
                <button class="secondary-btn" id="btn-change-pass" data-i18n="changePassBtn" style="margin-bottom: 12px;"></button>
                <button class="primary-btn" id="btn-export" data-i18n="exportBtn" style="margin-bottom: 15px;"></button>
                
                <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">
                
                <h4 style="margin: 0 0 8px 0;" data-i18n="importTitle"></h4>
                <div class="file-upload-wrapper">
                    <label for="import-file" class="file-upload-label" id="file-label" data-i18n="chooseFileBtn"></label>
                    <input type="file" id="import-file" accept=".json">
                </div>
                <button class="primary-btn" id="btn-import" data-i18n="importBtn"></button>
            </div>
        </div>

        <p class="notice-text" data-i18n="footerNotice"></p>
    </div>

    <div id="toast"></div>
</body>
</html>
